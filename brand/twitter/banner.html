<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#010608}svg{display:block}
.disp{font-family:"DM Sans",system-ui,sans-serif}.mono{font-family:"Geist Mono",ui-monospace,monospace}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03141a"/><stop offset=".62" stop-color="#010608"/><stop offset="1" stop-color="#010608"/>
    </linearGradient>
    <radialGradient id="halo" cx="380" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34b7dd" stop-opacity=".32"/><stop offset=".45" stop-color="#2d7388" stop-opacity=".12"/><stop offset="1" stop-color="#2d7388" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="finG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93d9ee"/><stop offset=".5" stop-color="#34b7dd"/><stop offset="1" stop-color="#2d7388"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbf2f9"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34b7dd" stop-opacity="0"/><stop offset=".25" stop-color="#34b7dd" stop-opacity=".55"/><stop offset=".75" stop-color="#34b7dd" stop-opacity=".55"/><stop offset="1" stop-color="#34b7dd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#163b44" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gm"><rect width="1500" height="500" fill="url(#gridFade)"/></mask>
  </defs>

  <rect width="1500" height="500" fill="url(#sea)"/>
  <rect width="1500" height="500" fill="url(#grid)" mask="url(#gm)" opacity=".5"/>
  <rect width="1500" height="500" fill="url(#halo)"/>

  <!-- order-book depth bars along the waterline (bids left, asks right of the fin) -->
  <g opacity=".5">
    <g fill="#3ee6a8" fill-opacity=".35">
      <rect x="96" y="262" width="10" height="18"/><rect x="114" y="254" width="10" height="26"/><rect x="132" y="258" width="10" height="22"/>
      <rect x="150" y="246" width="10" height="34"/><rect x="168" y="250" width="10" height="30"/><rect x="186" y="238" width="10" height="42"/>
      <rect x="204" y="242" width="10" height="38"/><rect x="222" y="230" width="10" height="50"/>
    </g>
    <g fill="#ff5252" fill-opacity=".3">
      <rect x="548" y="232" width="10" height="48"/><rect x="566" y="240" width="10" height="40"/><rect x="584" y="236" width="10" height="44"/>
      <rect x="602" y="248" width="10" height="32"/><rect x="620" y="244" width="10" height="36"/><rect x="638" y="254" width="10" height="26"/>
      <rect x="656" y="258" width="10" height="22"/><rect x="674" y="264" width="10" height="16"/>
    </g>
  </g>

  <!-- fin (brand mark geometry, scaled) -->
  <g transform="translate(380 0)">
    <path d="M-150 280 C-90 268 -48 196 -36 76 C6 148 42 220 78 280 Z" fill="url(#finG)"/>
    <path d="M-36 76 C6 148 42 220 78 280 L60 280 C30 226 6 170 -30 100 Z" fill="#ffffff" opacity=".12"/>
  </g>

  <!-- waterline + ripples -->
  <path d="M0 292 Q40 282 80 292 T160 292 T240 292 T320 292 T400 292 T480 292 T560 292 T640 292 T720 292 T800 292" fill="none" stroke="#34b7dd" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#34b7dd" stroke-linecap="round">
    <path d="M110 322 Q150 312 190 322 T270 322 T350 322 T430 322 T510 322 T590 322 T670 322" stroke-width="3" opacity=".45"/>
    <path d="M190 350 Q220 342 250 350 T310 350 T370 350 T430 350 T490 350 T550 350" stroke-width="2.5" opacity=".25"/>
    <path d="M260 376 Q290 370 320 376 T380 376 T440 376 T500 376" stroke-width="2" opacity=".14"/>
  </g>

  <!-- divider -->
  <rect x="822" y="120" width="1" height="260" fill="url(#fadeR)" transform="rotate(90 822 120) translate(0 0)" opacity="0"/>
  <rect x="808" y="140" width="1.5" height="220" fill="#163b44"/>

  <!-- copy -->
  <g transform="translate(860 0)">
    <text x="0" y="166" class="mono" font-size="17" letter-spacing="4" fill="#34b7dd">$MAKO · ELYSIUM · HYPERCORE</text>
    <text x="-4" y="252" class="disp" font-size="92" font-weight="700" letter-spacing="-3" fill="url(#word)">Mako Desk</text>
    <text x="0" y="306" class="disp" font-size="31" font-weight="400" letter-spacing="-.4" fill="#93b3bb">The memecoin that <tspan fill="#ffffff" font-weight="500">makes markets.</tspan></text>
    <g transform="translate(0 352)">
      <rect x="0" y="0" width="164" height="38" rx="19" fill="none" stroke="#163b44" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="5" fill="#3ee6a8"/>
      <text x="34" y="25" class="mono" font-size="15" fill="#dbf2f9">makodesk.xyz</text>
      <text x="186" y="25" class="mono" font-size="15" fill="#5f828b">Quoting every block</text>
    </g>
  </g>
</svg></body></html>
